name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: false

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Show APK info
        run: |
          ls -lh app/build/outputs/apk/release/
          echo "APK_SIZE=$(stat -c%s app/build/outputs/apk/release/*.apk)" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gmssh-android-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.7
          name: 极目桌面 Android v2.0.7
          body: |
            GMSSH 桌面端网页前端 + Android WebView 壳。

            - 包名：`com.gmssh.android`
            - 版本：2.0.7
            - 已内置 electronAPI 兼容垫片（client-auth 走内置授权页）
            - 前端静态文件由本地服务 browserPort 托管（页面与 API 同源，无混合内容）
            - APK 大小：${{ env.APK_SIZE }} 字节
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
